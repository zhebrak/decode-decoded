# The smoke run: the first rented hour on the study's box, under Docker, before S1 (README.md). The study's grid
# unchanged (every setting, the clock lock included), one session SMOKE that holds what only a Docker host can
# check, at Qwen3-0.6B: every S1 and S2 capture path (bring-up with the hostload contention inside the containers,
# the scale block's 256 sequences, the servers profiled, the runner, the DRAM counters), S3's long-context and
# second-family paths (at 0.6B and Llama-3.2-1B: neither ever ran anywhere), and, trimmed, the noise block and two
# sentinels, one unlocked: --block expands blocks only (anatomy.grid), so without a session of their own the noise
# units, the sentinels and the unlocked sentinel's unlock and relock would first run in S1, hours in.
# validation: true marks every unit: never study data.
#   GRID=configs/grid/smoke.yaml scripts/box.sh grid $SMOKE SMOKE --timeout 1500
extends: configs/grid/v1.yaml
validation: true
sentinels:
  - {engine: vllm, arm: defaults, level: L1, model: Qwen/Qwen3-0.6B, batches: [1]}
  - {engine: sglang, arm: defaults, level: L1, model: Qwen/Qwen3-0.6B, batches: [1], unlocked: true}
noise:
  session: SMOKE
  processes: 2
  with_sentinels: true
  cells:
    small: {engines: [vllm], arms: [defaults], levels: [headline, L2], models: [Qwen/Qwen3-0.6B], batches: [1, 8]}
    occupancy: {engines: [vllm], arms: [defaults], levels: [headline], models: [Qwen/Qwen3-0.6B], batches: [1],
                captures: {graph: all}}   # the noise block's graph traces: occupancy's own spread between processes
blocks:
  mitigations:   # the arms no other smoke block runs (graphs-off is the anchors'): each
    session: SMOKE   # engine's scheduler switches, under its image, before S2 runs them at every model
    engines: [vllm, sglang, trtllm]
    arms: [async-off, mrv2-off, overlap-off]
    levels: [headline]
    cells: [[Qwen/Qwen3-0.6B, 1]]
    captures: {timing: all}
  bringup:
    session: SMOKE
    engines: [vllm, sglang, trtllm]
    arms: [defaults]
    levels: [headline]
    cells: [[Qwen/Qwen3-0.6B, 1], [Qwen/Qwen3-0.6B, 64]]
    captures: {timing: all, graph: all, node: all, hostload: all}
  scale:
    session: SMOKE
    engines: [vllm, sglang, trtllm]
    arms: [defaults]
    levels: [headline]
    cells: [[Qwen/Qwen3-0.6B, 256]]
    captures: {timing: all, node: all}
  anchors:
    session: SMOKE
    engines: [vllm, sglang, trtllm]
    arms: [graphs-off]
    levels: [headline]
    cells: [[Qwen/Qwen3-0.6B, 1]]
    captures: {timing: all, graph: all}
  power:         # one cell at the card's power cap: 14B at the KV bound draws the 700 W (the cap held 0.9 of SGLang's
    session: SMOKE   # busy samples in validation), so a locked clock log under the cap is read here, by the rule that
    engines: [sglang]   # judges the lock where nothing slowed the clock (configs/tolerances.yaml clock_lock), before
    arms: [defaults]    # S1's scale block and S2's large cells rest on it
    levels: [headline]
    cells: [[Qwen/Qwen3-14B, max]]
    captures: {timing: all}
  served:
    session: SMOKE
    engines: [vllm, sglang, trtllm]
    arms: [defaults]
    levels: [L2]
    models: [Qwen/Qwen3-0.6B]
    batches: [1, 64]
    captures: {served: all, graph: all}
  runner:
    session: SMOKE
    engines: [sglang]
    arms: [defaults]
    levels: [L0]
    models: [Qwen/Qwen3-0.6B]
    batches: [1, 64]
    captures: {runner: all}
  long_context:
    session: SMOKE
    context: {prompt_len: 8064, gen_len: 288}
    engines: [vllm, sglang, trtllm]
    arms: [defaults]
    levels: [headline]
    models: [Qwen/Qwen3-0.6B]
    batches: [1, 8]
    captures: {timing: all, graph: all}
  second_family:
    session: SMOKE
    engines: [vllm, sglang]
    arms: [defaults]
    levels: [headline]
    models: [unsloth/Llama-3.2-1B-Instruct]
    batches: [1, 64]
    captures: {timing: all, graph: all}
  dram:
    session: SMOKE
    engines: [vllm, sglang]
    arms: [defaults]
    levels: [headline]
    models: [Qwen/Qwen3-0.6B]
    batches: [1, 64]
    captures: {metrics: all}
