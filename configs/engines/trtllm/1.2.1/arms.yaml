# TensorRT-LLM 1.2.1 (released 2026-04-20; 1.3.0rc29 exists), PyTorch backend. Keys from the LLM API (llm_args.py at
# the v1.2.1 tag) and checked against the image's tensorrt_llm/llmapi/llm_args.py (CudaGraphConfig, KvCacheConfig,
# TorchLlmArgs). args are LLM(...) keyword arguments for the offline driver; the server gets the same mapping as
# --extra_llm_api_options YAML.
engine: trtllm
version: 1.2.1
image: nvcr.io/nvidia/tensorrt-llm/release:1.2.1
levels: [L1, L2]
gpu_processes: 2                         # the LLM-API process and its MPI worker both hold a GPU context, at L1 and
                                         # L2: a unit is shared only beyond these (validation: 2 in every unit)
entrypoint: [/opt/nvidia/nvidia_entrypoint.sh]   # NGC images set their library paths up here
common:
  args:
    max_batch_size: 256
    max_num_tokens: 8192
    max_seq_len: 8448
    kv_cache_config: {free_gpu_memory_fraction: 0.9, enable_block_reuse: false}
    # pad to a captured size, as vLLM, SGLang and trtllm-bench do (unpadded, a batch of 36 runs eager), and capture
    # every 8 up to 256 as vLLM and SGLang do: TensorRT-LLM's own padded list stops at 128 and jumps to 256, so 14B's
    # largest batch, 211, would run 45 padding rows where the others run 5 (batch_sizes alone: with max_batch_size
    # too, it must equal the generated list)
    cuda_graph_config:
      enable_padding: true
      batch_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160,
                    168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256]
    stream_interval: 1                   # one chunk per token: the cadence estimator's assumption
profile: {}                              # the offline driver brackets the window with cudaProfilerStart/Stop itself
request:                           # sent with every L2 request (AIPerf --extra-inputs, the stream client's body)
  stream_options: {include_usage: true, continuous_usage_stats: true}   # cumulative completion_tokens in every chunk;
                                   # token ids would need detokenize false, removing work the other servers do.
                                   # (validated: AIPerf's raw export carries it, and every stream counts 288)
arms:
  defaults: {}                           # overlap scheduler on, CUDA graphs every 8 up to batch 256
  overlap-off:
    args: {disable_overlap_scheduler: true}
  graphs-off:
    args: {cuda_graph_config: null}
    anchor: "argmax|ArgMax"              # no graph launch to anchor a step on: greedy argmax, once a step
